  <!-- ═══ production row ═══ -->
  <rect x="60" y="224" width="300" height="56" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <circle cx="88" cy="252" r="5" fill="none" stroke="#6366F1" stroke-width="2"/>
  <text x="106" y="257" font-size="14" fill="#3730A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mifid/production</text>

  <!-- separator -->
  <line x1="60" y1="312" x2="900" y2="312" stroke="#E2E8F0" stroke-dasharray="4 4"/>

  <!-- branch elbow: develop → feature -->
  <path d="M60,92 L34,92 L34,388 L58,388" fill="none" stroke="#A5B4FC" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#FFFFFF"/>

  <!-- branch tags above env boxes -->
  <text x="160" y="66" font-size="12.5" fill="#6366F1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mifid/develop</text>
  <text x="480" y="66" font-size="12.5" fill="#6366F1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mifid/staging</text>
  <text x="800" y="66" font-size="12.5" fill="#6366F1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mifid/production</text>

  <!-- develop -->
  <rect x="60" y="80" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="160" y="112" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Develop</text>
  <rect x="90" y="126" width="140" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="160" y="140" font-size="11" fill="#475569" text-anchor="middle">read-only · CI deploys</text>
  <text x="160" y="192" font-size="11" fill="#94A3B8" text-anchor="middle">⟳ drift-checked on schedule</text>

  <!-- gate develop → staging -->
  <line x1="260" y1="125" x2="378" y2="125" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="299" y="111" width="42" height="28" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="320" y="130" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">MR</text>
  <text x="320" y="158" font-size="11" fill="#B45309" text-anchor="middle">Technical approver</text>

  <!-- staging -->
  <rect x="380" y="80" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="480" y="112" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Staging</text>
  <rect x="404" y="126" width="152" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="480" y="140" font-size="11" fill="#475569" text-anchor="middle">read-only · validation runs</text>
  <text x="480" y="192" font-size="11" fill="#94A3B8" text-anchor="middle">⟳ drift-checked on schedule</text>

  <!-- gate staging → production -->
  <line x1="580" y1="125" x2="698" y2="125" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="619" y="111" width="42" height="28" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="640" y="130" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">MR</text>
  <text x="640" y="158" font-size="11" fill="#B45309" text-anchor="middle">Business approver</text>
  <text x="640" y="173" font-size="11" fill="#B45309" text-anchor="middle">ticket linkage</text>

  <!-- production -->
  <rect x="700" y="80" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="800" y="112" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Production</text>
  <rect x="716" y="126" width="168" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="800" y="140" font-size="11" fill="#475569" text-anchor="middle">read-only · governed runtime</text>
  <text x="800" y="192" font-size="11" fill="#94A3B8" text-anchor="middle">⟳ drift-checked on schedule</text>

  <!-- commit-gated deploy note under production -->
  <rect x="676" y="208" width="248" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="800" y="229" font-size="11.5" fill="#64748B" text-anchor="middle">commit-gated deploy · signed evidence</text>

  <!-- feature branches feeding develop -->
  <rect x="72" y="296" width="176" height="56" rx="10" fill="#EEF2FF" stroke="#C7D2FE" opacity="0.55"/>
  <rect x="66" y="290" width="176" height="56" rx="10" fill="#EEF2FF" stroke="#C7D2FE" opacity="0.75"/>
  <rect x="60" y="284" width="176" height="56" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="148" y="317" font-size="13" fill="#3730A3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mifid/feat/*</text>
  <line x1="148" y1="284" x2="158" y2="172" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="212" y="238" font-size="11" fill="#B45309" text-anchor="middle">MR · peer review</text>

  <!-- hotfix path -->
  <path d="M830,170 L830,320 L254,320" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr3)"/>
  <text x="545" y="312" font-size="11" fill="#94A3B8" text-anchor="middle">hotfix — branch off production · same gates, expedited · back-merged down</text>
</svg>

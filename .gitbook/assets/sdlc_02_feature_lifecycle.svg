<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr2i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A5B4FC"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="330" fill="#FFFFFF"/>

  <!-- sync self-loop above "Build" -->
  <path d="M255,120 C255,74 335,74 335,116" fill="none" stroke="#A5B4FC" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr2i)"/>
  <text x="295" y="66" font-size="11.5" fill="#6366F1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">feature sync</text>
  <text x="295" y="82" font-size="10.5" fill="#94A3B8" text-anchor="middle">pull the latest develop baseline</text>

  <!-- review-remarks loop from gate back to Build -->
  <path d="M660,196 L660,240 L295,240 L295,190" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr2i)"/>
  <text x="477" y="258" font-size="11" fill="#B45309" text-anchor="middle">review remarks → keep building, request again</text>

  <!-- step 1: start -->
  <rect x="40" y="120" width="170" height="70" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="125" y="150" font-size="13.5" font-weight="600" fill="#3730A3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">feature start</text>
  <text x="125" y="170" font-size="11" fill="#64748B" text-anchor="middle">branch + hydrate workspace</text>
  <line x1="210" y1="155" x2="238" y2="155" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- step 2: build -->
  <rect x="240" y="120" width="170" height="70" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="325" y="150" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Build in KAWA</text>
  <text x="325" y="170" font-size="11" fill="#64748B" text-anchor="middle">full freedom · AI-assisted</text>
  <line x1="410" y1="155" x2="438" y2="155" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- step 3: request -->
  <rect x="440" y="120" width="170" height="70" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="525" y="150" font-size="13.5" font-weight="600" fill="#3730A3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">feature request</text>
  <text x="525" y="170" font-size="11" fill="#64748B" text-anchor="middle">snapshot → merge request</text>
  <line x1="610" y1="155" x2="638" y2="155" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- step 4: merge gate -->
  <rect x="640" y="120" width="150" height="70" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="715" y="150" font-size="13.5" font-weight="600" fill="#92400E" text-anchor="middle">Merge gate</text>
  <text x="715" y="170" font-size="11" fill="#B45309" text-anchor="middle">CI checks + approvals</text>
  <line x1="790" y1="155" x2="818" y2="155" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- step 5: merged -->
  <rect x="820" y="120" width="120" height="70" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="880" y="150" font-size="13.5" font-weight="600" fill="#047857" text-anchor="middle">Merged</text>
  <text x="880" y="170" font-size="11" fill="#059669" text-anchor="middle">CI deploys develop</text>

  <!-- retirement note under merged -->
  <line x1="880" y1="190" x2="880" y2="284" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
  <rect x="620" y="286" width="320" height="34" rx="17" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="780" y="307" font-size="11.5" fill="#64748B" text-anchor="middle">feature workspace + branch retired (discard / reaper)</text>
</svg>

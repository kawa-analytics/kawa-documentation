<svg viewBox="0 0 1400 850" width="1400" height="850" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/></filter>
 <marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#0ea5e9"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#0d9488"/></marker>
 <marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#7c3aed"/></marker>
 <marker id="ar-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#94a3b8"/></marker>
</defs>

<rect width="1400" height="850" fill="#ffffff"/>

<!-- ===================== Header ===================== -->
<text x="50" y="52" font-size="26" font-weight="700" fill="#0f172a">KAWA on Databricks — Native Unity Catalog Connection</text>
<text x="50" y="80" font-size="14" fill="#64748b">KAWA's engine runs directly on the customer's Databricks SQL Warehouse — live Delta tables, full governance, zero data extraction.</text>
<line x1="0" y1="104" x2="1400" y2="104" stroke="#e2e8f0"/>

<!-- ===================== KAWA Platform ===================== -->
<rect x="50" y="150" width="330" height="620" rx="14" fill="#f8fafc" stroke="#e2e8f0" filter="url(#sh)"/>
<text x="70" y="187" font-size="20" font-weight="700" fill="#0ea5e9">KAWA Platform</text>
<line x1="70" y1="200" x2="360" y2="200" stroke="#e2e8f0"/>

<!-- item 1 -->
<rect x="70" y="215" width="290" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="70" y="215" width="4" height="58" rx="2" fill="#0ea5e9"/>
<text x="88" y="239" font-size="14" font-weight="600" fill="#1e293b">Computation engine</text>
<text x="88" y="259" font-size="12" fill="#64748b">SQL generation · full pushdown</text>
<!-- item 2 -->
<rect x="70" y="285" width="290" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="70" y="285" width="4" height="58" rx="2" fill="#0ea5e9"/>
<text x="88" y="309" font-size="14" font-weight="600" fill="#1e293b">Python ETL · SDK · workflows</text>
<text x="88" y="329" font-size="12" fill="#64748b">pandas, CSV, streaming loads</text>
<!-- item 3 -->
<rect x="70" y="355" width="290" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="70" y="355" width="4" height="58" rx="2" fill="#0ea5e9"/>
<text x="88" y="379" font-size="14" font-weight="600" fill="#1e293b">Connection pools</text>
<text x="88" y="399" font-size="12" fill="#64748b">READ ONLY · WRITE BACK</text>
<!-- item 4 -->
<rect x="70" y="425" width="290" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="70" y="425" width="4" height="58" rx="2" fill="#0ea5e9"/>
<text x="88" y="449" font-size="14" font-weight="600" fill="#1e293b">Parquet streaming writer</text>
<text x="88" y="469" font-size="12" fill="#64748b">in-memory · no temp files</text>
<!-- item 5 -->
<rect x="70" y="495" width="290" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="70" y="495" width="4" height="58" rx="2" fill="#0ea5e9"/>
<text x="88" y="519" font-size="14" font-weight="600" fill="#1e293b">Health monitor</text>
<text x="88" y="539" font-size="12" fill="#64748b">REST probe · warm-up &amp; retry</text>
<!-- item 6 -->
<rect x="70" y="565" width="290" height="68" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="70" y="565" width="4" height="68" rx="2" fill="#0ea5e9"/>
<text x="88" y="587" font-size="14" font-weight="600" fill="#1e293b">Authentication</text>
<text x="88" y="606" font-size="12" fill="#64748b">PAT — service identity</text>
<text x="88" y="623" font-size="12" fill="#64748b">OAuth — IdP federation</text>

<text x="88" y="740" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#94a3b8">com.databricks : databricks-jdbc</text>

<!-- ===================== Databricks Workspace ===================== -->
<rect x="560" y="120" width="790" height="650" rx="16" fill="#fffaf5" stroke="#ea580c" stroke-width="2" filter="url(#sh)"/>
<text x="580" y="158" font-size="20" font-weight="700" fill="#ea580c">Databricks Workspace</text>
<text x="1330" y="158" font-size="12" fill="#9a3412" text-anchor="end">customer's cloud account</text>

<!-- SQL Warehouse -->
<rect x="600" y="185" width="710" height="95" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="620" y="212" font-size="17" font-weight="700" fill="#9a3412">SQL Warehouse <tspan font-size="13" font-weight="400" fill="#b45309">· serverless or pro</tspan></text>
<text x="620" y="233" font-size="12" fill="#92400e">Spark SQL · Photon · elastic compute</text>
<g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">
 <rect x="620" y="245" width="132" height="24" rx="6" fill="#ffffff" stroke="#fdba74"/><text x="686" y="261" fill="#9a3412" text-anchor="middle">SELECT pushdown</text>
 <rect x="764" y="245" width="64" height="24" rx="6" fill="#ffffff" stroke="#fdba74"/><text x="796" y="261" fill="#9a3412" text-anchor="middle">MERGE</text>
 <rect x="840" y="245" width="92" height="24" rx="6" fill="#ffffff" stroke="#fdba74"/><text x="886" y="261" fill="#9a3412" text-anchor="middle">COPY INTO</text>
 <rect x="944" y="245" width="176" height="24" rx="6" fill="#ffffff" stroke="#fdba74"/><text x="1032" y="261" fill="#9a3412" text-anchor="middle">CREATE TABLE + delta.*</text>
 <rect x="1132" y="245" width="100" height="24" rx="6" fill="#ffffff" stroke="#fdba74"/><text x="1182" y="261" fill="#9a3412" text-anchor="middle">DEEP CLONE</text>
</g>

<!-- Unity Catalog -->
<rect x="600" y="330" width="710" height="400" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
<text x="620" y="362" font-size="18" font-weight="700" fill="#7c3aed">Unity Catalog</text>
<text x="620" y="382" font-size="12" fill="#64748b">grants · lineage · audit · information_schema</text>

<!-- Staging volume -->
<rect x="620" y="400" width="330" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="620" y="400" width="4" height="110" rx="2" fill="#0d9488"/>
<text x="638" y="426" font-size="14" font-weight="600" fill="#1e293b">Staging Volume <tspan font-size="11" fill="#0d9488">transient</tspan></text>
<text x="638" y="448" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#0f766e">/Volumes/catalog/kawa/kw__loading/</text>
<text x="638" y="470" font-size="12" fill="#64748b">streamed Parquet files</text>
<text x="638" y="488" font-size="12" fill="#64748b">auto-provisioned · auto-cleaned</text>

<!-- COPY INTO arrow -->
<line x1="785" y1="510" x2="785" y2="554" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<text x="800" y="538" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#0d9488">COPY INTO</text>

<!-- KAWA Delta tables -->
<rect x="620" y="560" width="330" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="620" y="560" width="4" height="150" rx="2" fill="#16a34a"/>
<text x="638" y="586" font-size="14" font-weight="600" fill="#1e293b">KAWA Delta tables</text>
<text x="638" y="608" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#15803d">catalog.kawa.kw__*</text>
<text x="638" y="632" font-size="12" fill="#64748b">column mapping · row tracking</text>
<text x="638" y="650" font-size="12" fill="#64748b">TIMESTAMP_NTZ · schema evolution</text>
<text x="638" y="668" font-size="12" fill="#64748b">CSV uploads · DataFrames · ETL outputs</text>
<text x="638" y="686" font-size="12" fill="#64748b">views &amp; transformations</text>

<!-- Customer catalogs -->
<rect x="990" y="400" width="300" height="310" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="990" y="400" width="4" height="310" rx="2" fill="#64748b"/>
<text x="1008" y="426" font-size="14" font-weight="600" fill="#1e293b">Customer catalogs</text>
<rect x="1180" y="410" width="96" height="22" rx="11" fill="#f1f5f9"/>
<text x="1228" y="425" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">SELECT only</text>
<g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#475569">
 <text x="1008" y="458">sales.finance.trades</text>
 <text x="1008" y="480">ops.risk.positions</text>
 <text x="1008" y="502">crm.core.accounts</text>
 <text x="1008" y="524">…</text>
</g>
<text x="1008" y="560" font-size="12" fill="#64748b">Existing Delta tables and views,</text>
<text x="1008" y="578" font-size="12" fill="#64748b">queried in place — no copy,</text>
<text x="1008" y="596" font-size="12" fill="#64748b">no extraction, no sync jobs.</text>
<text x="1008" y="630" font-size="12" fill="#64748b">Browsable from the KAWA UI</text>
<text x="1008" y="648" font-size="12" fill="#64748b">across the full three-level</text>
<text x="1008" y="666" font-size="12" fill="#64748b">namespace.</text>

<!-- ===================== Arrows KAWA -> Databricks ===================== -->
<!-- JDBC -->
<line x1="384" y1="235" x2="594" y2="235" stroke="#0ea5e9" stroke-width="2.5" marker-start="url(#ar-blue)" marker-end="url(#ar-blue)"/>
<text x="478" y="220" font-size="13" font-weight="600" fill="#0ea5e9" text-anchor="middle">JDBC — SQL pushdown</text>
<text x="489" y="256" font-size="11.5" fill="#64748b" text-anchor="middle">queries · DDL · MERGE</text>

<!-- Files API -->
<line x1="384" y1="455" x2="614" y2="455" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<text x="489" y="440" font-size="13" font-weight="600" fill="#0d9488" text-anchor="middle">Files API (HTTPS)</text>
<text x="489" y="476" font-size="11.5" fill="#64748b" text-anchor="middle">streamed Parquet</text>

<!-- Health probe -->
<line x1="384" y1="524" x2="552" y2="524" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-slate)"/>
<text x="470" y="509" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">REST health probe</text>
<text x="470" y="545" font-size="11.5" fill="#94a3b8" text-anchor="middle">zero compute</text>

<!-- Warehouse <-> Unity Catalog -->
<line x1="1120" y1="286" x2="1120" y2="324" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#ar-purple)" marker-end="url(#ar-purple)"/>
<text x="1136" y="302" font-size="12" font-weight="600" fill="#7c3aed">governed reads &amp; writes</text>
<text x="1136" y="319" font-size="11.5" fill="#64748b">grants · lineage · audit</text>

<!-- ===================== Footer badges ===================== -->
<rect x="405" y="796" width="170" height="32" rx="16" fill="#f0f9ff" stroke="#bae6fd"/>
<text x="490" y="817" font-size="13" font-weight="600" fill="#0284c7" text-anchor="middle">Zero data extraction</text>
<rect x="605" y="796" width="210" height="32" rx="16" fill="#faf5ff" stroke="#ddd6fe"/>
<text x="710" y="817" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">Governed by Unity Catalog</text>
<rect x="845" y="796" width="150" height="32" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="920" y="817" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">Delta Lake native</text>
</svg>
